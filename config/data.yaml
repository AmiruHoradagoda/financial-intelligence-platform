project:
  name: "financial-intelligence-platform"
  environment: "development"
  random_seed: 42

documents:
  input_dir: "data/raw"
  output_dir: "data/processed"

  files:
    - "uber_2024.pdf"
    - "uber_2023.pdf"

ingestion:
  chunk_size: 1500
  chunk_overlap: 150
  remove_headers_footers: true
  preserve_page_metadata: true

data_generation:
  questions_per_chunk: 10

  categories:
    hard_facts: 4
    strategic_summaries: 4
    stylistic_creative: 2

  question_model: null
  answer_model: null

  temperature: 0.2

dataset:
  train_ratio: 0.8
  test_ratio: 0.2
  random_seed: 42

  train_file: "data/processed/train.jsonl"
  test_file: "data/processed/golden_test_set.jsonl"