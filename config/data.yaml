project:
  name: "financial-intelligence-platform"
  environment: "development"
  random_seed: 42

documents:
  input_dir: "data/raw"
  output_dir: "data/processed"

  files:
    - "uber_2024.pdf"
    - "uber_2023.pdf"

chunking:
  data_factory:
    strategy: "fixed"
    chunk_size: 1500
    chunk_overlap: 0

  rag:
    strategy: "sliding"
    chunk_size: 1500
    chunk_overlap: 150

data_generation:
  questions_per_chunk: 10

dataset:
  train_ratio: 0.8
  test_ratio: 0.2
  random_seed: 42

  train_file: "data/processed/train.jsonl"
  test_file: "data/processed/golden_test_set.jsonl"