vector_database:
  provider: "weaviate"
  collection_name: "FinancialReports"

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"

retrieval:
  dense_top_k: 10
  bm25_top_k: 10

  fusion:
    method: "rrf"
    k: 60

reranking:
  enabled: true
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  final_top_k: 5

generation:
  temperature: 0.0
  max_output_tokens: 512
  require_citations: true
  abstain_on_insufficient_evidence: true